96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#7a867f" font-size="9">复盘别开表彰会，找找哪里在漏水。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3328</text><text x="725" y="81" fill="#e5e9e3" font-size="10">b4fd75f3730f02b4&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#7a867f" font-size="9">面善打个D啊，喜欢我的战斗脸吗？</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3329</text><text x="899" y="81" fill="#e5e9e3" font-size="10">2c9184176e08d90b&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#7a867f" font-size="9">赢了请吃饭，输了先做功课。</text></svg>
