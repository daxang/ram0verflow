96" fill="#5cab9b" font-size="10.5">@ram0verflow</text><text x="551" y="110" fill="#7a867f" font-size="9">it sees only mathemat&#8230;</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3510</text><text x="725" y="81" fill="#e5e9e3" font-size="10">c576ce3752a7886a&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#7a867f" font-size="9">我负责承认不懂，显卡负责继续算。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3511</text><text x="899" y="81" fill="#e5e9e3" font-size="10">f7ed9cfcadad7d46&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#7a867f" font-size="9">市场难以预测，这道题可以验证。</text></svg>
