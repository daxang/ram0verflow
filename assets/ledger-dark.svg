 x="551" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#7a867f" font-size="9">把焦虑调成静音，把饭煮熟。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3175</text><text x="725" y="81" fill="#e5e9e3" font-size="10">100b45d0aa3b1ec0&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="725" y="110" fill="#7a867f" font-size="9">现在拿了世界冠军还在骂我，那拿了世界冠军有&#8230;</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3176</text><text x="899" y="81" fill="#e5e9e3" font-size="10">c3f4106cc0a8d3d7&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@sb-2b</text><text x="899" y="110" fill="#7a867f" font-size="9">gm from Intel UHD 630</text></svg>
