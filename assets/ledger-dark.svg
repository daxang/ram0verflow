<text x="18" y="26" fill="#e5e9e3" font-size="15" font-weight="700">ROFL</text><text x="72" y="26" fill="#7a867f" font-size="12.5">height 3237 &#183; difficulty 21 &#183; 21 puzzles per block</text><rect x="18" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="29" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3232</text><text x="29" y="81" fill="#e5e9e3" font-size="10">c58ae1927b999fa0&#8230;</text><text x="29" y="96" fill="#5cab9b" font-size="10.5">@ywltby</text><text x="29" y="110" fill="#7a867f" font-size="9">以前说拿了世界冠军就不骂我了，</text><line x1="166" y1="82.0" x2="192" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="192" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="203" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3233</text><text x="203" y="81" fill="#e5e9e3" font-size="10">7a48ad6055286d1f&#8230;</text><text x="203" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="203" y="110" fill="#7a867f" font-size="9">答案藏得挺好，下次别藏了。</text><line x1="340" y1="82.0" x2="366" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="366" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="377" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3234</text><text x="377" y="81" fill="#e5e9e3" font-size="10">15a3896a07bb9317&#8230;</text><text x="377" y="96" fill="#5cab9b" font-size="10.5">@Aitensa</text><text x="377" y="110" fill="#7a867f" font-size="9">gm from Aitensa</text><line x1="514" y1="82.0" x2="540" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="540" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="551" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3235</text><text x="551" y="81" fill="#e5e9e3" font-size="10">cac6dd8f58e0f80e&#8230;</text><text x="551" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="551" y="110" fill="#7a867f" font-size="9">先别开香槟，主链还没签收。</text><line x1="688" y1="82.0" x2="714" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="714" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="725" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3236</text><text x="725" y="81" fill="#e5e9e3" font-size="10">c06d2011164f9043&#8230;</text><text x="725" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="725" y="110" fill="#7a867f" font-size="9">我不是卷，我只是风扇转得快。</text><line x1="862" y1="82.0" x2="888" y2="82.0" stroke="#38443e" stroke-width="1.5" stroke-dasharray="3 3"/><rect x="888" y="44" width="148" height="76" rx="4" fill="#131b17" stroke="#28332e" stroke-width="1"/><text x="899" y="65" fill="#d9a64c" font-size="13" font-weight="700">#3237</text><text x="899" y="81" fill="#e5e9e3" font-size="10">8fb6f76668db8647&#8230;</text><text x="899" y="96" fill="#5cab9b" font-size="10.5">@hbzhong</text><text x="899" y="110" fill="#7a867f" font-size="9">每个随机数，都值得被礼貌询问。</text></svg>
